services:
  traefik:
    image: traefik:v3.7
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      # auto discovering of balanced nodes (docker provider)
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml
    depends_on:
      - wwwserver

  wwwserver:
    build: .
    image: asn/phpwebapp:v1
    env_file: .env
    ports:
      # Only the container port: docker assigns a random free host port to each replica
      - "80"
    volumes:
      - ./html:/var/www/html
    scale: 2
    # limit resources for testing
    cpus: .25
    mem_limit: 48m
    memswap_limit: 48m  # Swap not allowed if this value is equal to mem_limit
    labels:
      # Traefik discovers this container through the docker socket
      - "traefik.enable=true"
      - "traefik.http.routers.wwwserver.rule=PathPrefix(`/`)"
      - traefik.http.services.wwwserver.loadbalancer.server.port=80
      # health check L7: Traefik pide / a cada frontal y descarta el que no responde
      - traefik.http.services.wwwserver.loadbalancer.healthcheck.path=/
      - traefik.http.services.wwwserver.loadbalancer.healthcheck.interval=5s
      - traefik.http.services.wwwserver.loadbalancer.healthcheck.timeout=5s
      # máximo de peticiones en curso para el servicio: unas 10 por frontal con 2 réplicas
      - traefik.http.middlewares.wwwserver-inflight.inflightreq.amount=20
      # rate limit por IP de origen: 100 peticiones/s de media, con ráfagas de hasta 50
      - traefik.http.middlewares.wwwserver-ratelimit.ratelimit.average=100
      - traefik.http.middlewares.wwwserver-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.wwwserver-ratelimit.ratelimit.burst=50
      - traefik.http.routers.wwwserver.middlewares=wwwserver-ratelimit,wwwserver-inflight
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:latest
    env_file: .env
