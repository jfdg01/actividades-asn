## Frontales: web desde cualquier origen, salida solo hacia la base de datos
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: asn-wwwserver
spec:
  podSelector:
    matchLabels:
      role: wwwserver
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: 80
  egress:
  - to:
    - podSelector:
        matchLabels:
          role: database
